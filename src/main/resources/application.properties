spring.application.name=grh
# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=${HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Thymeleaf
spring.thymeleaf.cache=false

# Les entités chargées par les contrôleurs sont détachées : pas de flush implicite pendant le rendu
spring.jpa.open-in-view=false

# Formats des champs <input type="date"> et <input type="datetime-local">
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Session par cookie uniquement (pas de ;jsessionid dans les URL)
server.servlet.session.tracking-modes=cookie
