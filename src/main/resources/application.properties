spring.application.name=grh-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/grh
spring.datasource.username=grh
spring.datasource.password=grh
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est créé par db/grh_schema.sql : Hibernate ne touche pas au schéma
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

# Thymeleaf / MVC
spring.thymeleaf.cache=false
spring.mvc.format.date=iso
server.servlet.session.timeout=12h
# Garde l'identifiant de session dans un cookie (pas de ;jsessionid dans l'URL)
server.servlet.session.tracking-modes=cookie
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
