<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' · GRH'">Erreur · GRH</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="justify-content-center">
<main class="container py-5 text-center" style="max-width: 520px">
    <span class="section-icon mb-3" style="width:64px;height:64px;font-size:1.6rem">
        <i class="fa-solid" th:classappend="${status == 404} ? 'fa-magnifying-glass' : 'fa-triangle-exclamation'"></i>
    </span>
    <p class="text-muted fw-semibold mb-1" th:text="'Erreur ' + ${status}">Erreur</p>
    <h1 class="h3 fw-bold mb-3" th:text="${status == 404} ? 'Page ou élément introuvable' : 'Une erreur est survenue'">Erreur</h1>
    <p class="text-muted mb-4" th:text="${message}"></p>
    <a class="btn btn-primary" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Retour au tableau de bord</a>
</main>
</body>
</html>
