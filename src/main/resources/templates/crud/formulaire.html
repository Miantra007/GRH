<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:with="creation=${objet.id == null},
               titrePage=${(objet.id == null ? #strings.capitalize(vue.ecran.singulier) : objet.affichage)}">
<head th:replace="~{fragments/layout :: head(${titrePage})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<form th:action="@{${vue.base + '/enregistrer'}}" method="post" class="needs-validation d-flex flex-column flex-grow-1" novalidate>
    <input type="hidden" name="id" th:if="${!creation}" th:value="${objet.id}">

    <main class="container-xl py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
                <li class="breadcrumb-item"><a th:href="@{/}">Accueil</a></li>
                <li class="breadcrumb-item"><a th:href="@{${vue.base}}" th:text="${vue.ecran.titre}">Liste</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${creation} ? 'Nouveau' : 'Modifier'">Fiche</li>
            </ol>
        </nav>

        <div class="page-header d-flex align-items-center gap-3 mb-4">
            <span class="icone"><i class="fa-solid" th:classappend="${vue.ecran.icone}"></i></span>
            <div>
                <h1 th:text="${titrePage}">Titre</h1>
                <p class="text-muted small mb-0" th:if="${creation}">
                    <span class="badge rounded-pill bg-primary-subtle text-primary-emphasis me-1">Nouvel enregistrement</span>
                    Les champs marqués <span class="text-danger">*</span> sont obligatoires.
                </p>
                <p class="text-muted small mb-0" th:unless="${creation}">
                    <span th:text="${#strings.capitalize(vue.ecran.singulier)}"></span> n°<span th:text="${objet.id}"></span>
                </p>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="alert alert-danger d-flex gap-2" role="alert" th:unless="${#lists.isEmpty(erreursGlobales) and #maps.isEmpty(erreurs)}">
            <i class="fa-solid fa-triangle-exclamation mt-1"></i>
            <div>
                <strong>Le formulaire contient des erreurs.</strong>
                <ul class="mb-0 ps-3" th:unless="${#lists.isEmpty(erreursGlobales)}">
                    <li th:each="e : ${erreursGlobales}" th:text="${e}"></li>
                </ul>
            </div>
        </div>

        <div class="card-grh p-4">
            <div class="row g-3">
                <div th:each="c : ${vue.champsFormulaire}"
                     th:with="err=${erreurs[c.nom]}, id=${'champ-' + c.nom}"
                     th:class="${c.pleineLargeur or c.type.name() == 'BOOLEEN'} ? 'col-12' : 'col-md-6'">

                    <!-- Case à cocher -->
                    <div th:if="${c.type.name() == 'BOOLEEN'}" class="form-check form-switch mt-1">
                        <input type="hidden" th:name="${'_' + c.nom}" value="on">
                        <input class="form-check-input" type="checkbox" role="switch" th:id="${id}" th:name="${c.nom}"
                               th:checked="${vue.estCoche(objet, c)}">
                        <label class="form-check-label fw-semibold" th:for="${id}" th:text="${c.libelle}">Libellé</label>
                    </div>

                    <th:block th:unless="${c.type.name() == 'BOOLEEN'}">
                        <label class="form-label" th:for="${id}">
                            <span th:text="${c.libelle}">Libellé</span><span class="req" th:if="${c.obligatoire}">*</span>
                        </label>

                        <th:block th:switch="${c.type.name()}">
                            <!-- Relation : liste déroulante -->
                            <select th:case="'RELATION'" class="form-select" th:id="${id}" th:name="${c.nom}"
                                    th:required="${c.obligatoire}" th:classappend="${err != null} ? 'is-invalid'">
                                <option value="">— Choisir —</option>
                                <option th:each="opt : ${options[c.nom]}" th:value="${opt.id}" th:text="${opt.affichage}"
                                        th:selected="${vue.valeur(objet, c) == #strings.toString(opt.id)}"></option>
                            </select>

                            <!-- Énumération -->
                            <select th:case="'ENUMERATION'" class="form-select" th:id="${id}" th:name="${c.nom}"
                                    th:required="${c.obligatoire}" th:classappend="${err != null} ? 'is-invalid'">
                                <option value="">— Choisir —</option>
                                <option th:each="e : ${c.valeursEnum}" th:value="${e.name()}" th:text="${e.libelle}"
                                        th:selected="${vue.valeur(objet, c) == e.name()}"></option>
                            </select>

                            <!-- Texte long -->
                            <textarea th:case="'TEXTE_LONG'" class="form-control" rows="3" th:id="${id}" th:name="${c.nom}"
                                      th:required="${c.obligatoire}" th:classappend="${err != null} ? 'is-invalid'"
                                      th:text="${vue.valeur(objet, c)}"></textarea>

                            <!-- Autocomplétion -->
                            <div th:case="'AUTOCOMPLETE'" class="autocomplete" th:classappend="${err != null} ? 'is-invalid'"
                                 th:attr="data-source=@{${c.sourceAutocomplete}}" data-cle="nationalite" data-secondaire="pays">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                                    <input type="text" class="form-control" th:id="${id}" th:name="${c.parametre}"
                                           th:value="${vue.valeur(objet, c)}" th:required="${c.obligatoire}"
                                           th:classappend="${err != null} ? 'is-invalid'" placeholder="Rechercher…">
                                </div>
                                <ul class="autocomplete-menu"></ul>
                                <div class="invalid-feedback">Choisissez une valeur dans la liste.</div>
                            </div>

                            <!-- Mot de passe -->
                            <th:block th:case="'MOT_DE_PASSE'">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" th:id="${id}" th:name="${c.nom}"
                                           autocomplete="new-password"
                                           th:required="${c.obligatoire and creation}"
                                           th:classappend="${err != null} ? 'is-invalid'"
                                           th:placeholder="${creation} ? '' : 'Laisser vide pour conserver le mot de passe actuel'">
                                </div>
                            </th:block>

                            <!-- Champs simples -->
                            <input th:case="*" class="form-control" th:type="${c.typeHtml}" th:id="${id}" th:name="${c.nom}"
                                   th:value="${vue.valeur(objet, c)}" th:required="${c.obligatoire}"
                                   th:step="${c.type.name() == 'DECIMAL'} ? ${c.pas} : null"
                                   th:min="${c.type.name() == 'DECIMAL' or c.type.name() == 'ENTIER'} ? '0' : null"
                                   th:classappend="${err != null} ? 'is-invalid'">
                        </th:block>

                        <div class="invalid-feedback" th:classappend="${err != null} ? 'd-block'"
                             th:text="${err != null} ? ${err} : 'Ce champ est obligatoire.'">Ce champ est obligatoire.</div>
                        <div class="form-text" th:if="${c.aide}" th:text="${c.aide}"></div>
                    </th:block>
                </div>
            </div>
        </div>
    </main>

    <div class="action-bar py-3">
        <div class="container-xl d-flex flex-wrap align-items-center gap-2">
            <a class="btn btn-light border" th:href="@{${vue.base}}"><i class="fa-solid fa-arrow-left me-1"></i> Retour à la liste</a>
            <button type="button" class="btn btn-outline-danger" th:unless="${creation}"
                    data-bs-toggle="modal" data-bs-target="#modaleSuppression"
                    th:attr="data-url=@{${vue.base + '/' + objet.id + '/supprimer'}},data-libelle=${objet.affichage}">
                <i class="fa-solid fa-trash-can me-1"></i> Supprimer
            </button>
            <button type="submit" class="btn btn-primary ms-auto"><i class="fa-solid fa-floppy-disk me-1"></i> Enregistrer</button>
        </div>
    </div>
</form>

<div th:replace="~{fragments/layout :: modaleSuppression}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/autocomplete.js}"></script>
</body>
</html>
