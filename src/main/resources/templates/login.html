<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Connexion')}"></head>
<body>
<main class="connexion">
    <div class="text-center mb-4">
        <span class="brand-logo mb-3"><i class="fa-solid fa-people-group"></i></span>
        <h1 class="h4 fw-bold mb-1">Connexion à GRH</h1>
        <p class="text-muted mb-0">Gestion des ressources humaines</p>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <form class="card-grh p-4 needs-validation" th:action="@{/login}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="email">Adresse e-mail</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                <input class="form-control" id="email" name="email" type="email" autocomplete="username" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="mdp">Mot de passe</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input class="form-control" id="mdp" name="motDePasse" type="password" autocomplete="current-password" required>
            </div>
        </div>
        <button class="btn btn-primary w-100" type="submit">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Se connecter
        </button>
    </form>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
