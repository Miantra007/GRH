<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Décision RH')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container-xl py-4" style="max-width: 980px">
    <div class="page-header d-flex flex-wrap align-items-center gap-3 mb-4">
        <span class="icone"><i class="fa-solid fa-scale-balanced"></i></span>
        <div class="flex-grow-1">
            <h1>Réponse du candidat</h1>
            <p class="text-muted small mb-0">
                <strong th:text="${vue.titreOffre()}">Offre</strong> — <span th:text="${vue.nomComplet()}">Candidat</span>
            </p>
        </div>
        <span class="badge-statut signe"><i class="fa-solid fa-circle-info"></i> <span th:text="${vue.statutLibelle()}">Statut</span></span>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card-grh overflow-hidden mb-4">
        <div class="table-responsive">
            <table class="table table-grh">
                <thead>
                <tr><th>Critère</th><th>Proposition du RH</th><th>Réponse</th><th>Contre-proposition</th></tr>
                </thead>
                <tbody>
                <tr th:each="l : ${vue.lignes()}" th:classappend="${l.reponse() == 'AUTRE'} ? 'autre'">
                    <td class="fw-semibold" th:text="${l.label()}">Critère</td>
                    <td th:text="${l.valeurProposee()}">Valeur</td>
                    <td>
                        <span class="badge-statut" th:if="${l.reponse() != null}"
                              th:classappend="${l.reponse() == 'OUI'} ? 'valide' : (${l.reponse() == 'NON'} ? 'retard' : 'cree')"
                              th:text="${l.reponse()}">OUI</span>
                        <span class="text-muted" th:if="${l.reponse() == null}">—</span>
                    </td>
                    <td th:text="${l.contre() != null} ? ${l.contre()} : ''">Contre</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p th:if="${vue.commentaireRh() != null}"><i class="fa-regular fa-comment me-1"></i> Commentaire du RH : <em th:text="${vue.commentaireRh()}">commentaire</em></p>

    <form class="card-grh card-corps" method="post" th:action="@{/rh/propositions/{id}/decision(id=${vue.idProposition()})}" th:if="${vue.attenteRh()}">
        <label class="form-label" for="commentaire">Message au candidat (facultatif)</label>
        <textarea class="form-control" id="commentaire" name="commentaire" rows="3"></textarea>
        <div class="d-flex gap-2 mt-3">
            <button class="btn btn-success" type="submit" name="decision" value="VALIDER"><i class="fa-solid fa-check me-1"></i> Valider</button>
            <button class="btn btn-danger" type="submit" name="decision" value="REFUSER"><i class="fa-solid fa-xmark me-1"></i> Refuser</button>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
