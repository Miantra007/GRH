<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<header th:replace="~{header :: nav}"></header>
<main class="container-xl py-4" style="max-width: 820px">
    <div class="page-header d-flex align-items-center gap-3 mb-4">
        <span class="icone"><i class="fa-regular fa-bell"></i></span>
        <div>
            <h1>Notifications</h1>
            <p class="text-muted small mb-0"><span th:text="${#lists.size(liste)}">0</span> notification(s)</p>
        </div>
    </div>

    <div class="card-grh etat-vide" th:if="${liste.isEmpty()}">
        <i class="fa-regular fa-bell-slash"></i>
        <p class="fw-semibold text-body mb-0">Aucune notification</p>
    </div>

    <div class="card-grh card-corps mb-3" th:each="n : ${liste}">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-1">
            <h2 class="h6 fw-bold mb-0" th:text="${n.titre}">Titre</h2>
            <span class="text-muted small"><i class="fa-regular fa-clock me-1"></i><span th:text="${#temporals.format(n.dateCreation, 'dd/MM/yyyy HH:mm')}">date</span></span>
        </div>
        <p class="mb-2" th:text="${n.message}">Message</p>
        <a class="btn btn-outline-primary btn-sm" th:if="${n.idProposition != null and candidat}"
           th:href="@{/candidats/{c}/propositions/{p}(c=${proprietaire},p=${n.idProposition})}"><i class="fa-solid fa-arrow-right me-1"></i> Ouvrir la proposition</a>
        <a class="btn btn-primary btn-sm" th:if="${candidat and n.idProposition != null and (n.titre.contains('validé') or n.titre.contains('acceptée'))}"
           th:href="@{/candidat/contrats/nouveau(propositionId=${n.idProposition})}"><i class="fa-solid fa-file-signature me-1"></i> Choisir mon contrat</a>
        <a class="btn btn-primary btn-sm" th:if="${candidat and n.titre == 'Contrat validé par le RH'}"
           th:href="@{/candidat/integration}"><i class="fa-solid fa-list-check me-1"></i> Voir Mon intégration</a>
        <a class="btn btn-outline-primary btn-sm" th:if="${n.idProposition != null and !candidat}"
           th:href="@{/rh/propositions/{p}(p=${n.idProposition})}"><i class="fa-solid fa-arrow-right me-1"></i> Examiner la réponse</a>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
