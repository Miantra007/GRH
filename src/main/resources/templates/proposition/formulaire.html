<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Proposition d\'embauche')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container-xl py-4" style="max-width: 820px">
    <div class="page-header d-flex flex-wrap align-items-center gap-3 mb-4">
        <span class="icone"><i class="fa-solid fa-handshake"></i></span>
        <div class="flex-grow-1">
            <h1>Proposition d'embauche</h1>
            <p class="text-muted small mb-0">
                <strong th:text="${vue.titreOffre()}">Offre</strong> — <span th:text="${vue.nomComplet()}">Candidat</span>
            </p>
        </div>
        <span class="badge-statut signe"><i class="fa-solid fa-circle-info"></i> <span th:text="${vue.statutLibelle()}">Statut</span></span>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <form method="post" id="form">
        <div class="critere" th:each="l : ${vue.lignes()}">
            <h3 th:text="${l.label()}">Critère</h3>
            <div class="valeur" th:text="${l.valeurProposee()}">Valeur proposée</div>

            <div class="choix">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:id="|oui-${l.code()}|" th:name="|reponse[${l.code()}]|" value="OUI"
                           th:checked="${l.reponse() == 'OUI'}" th:disabled="${!vue.modifiable()}">
                    <label class="form-check-label" th:for="|oui-${l.code()}|">Oui</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:id="|non-${l.code()}|" th:name="|reponse[${l.code()}]|" value="NON"
                           th:checked="${l.reponse() == 'NON'}" th:disabled="${!vue.modifiable()}">
                    <label class="form-check-label" th:for="|non-${l.code()}|">Non</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" th:id="|autre-${l.code()}|" th:name="|reponse[${l.code()}]|" value="AUTRE"
                           th:checked="${l.reponse() == 'AUTRE'}" th:disabled="${!vue.modifiable()}">
                    <label class="form-check-label" th:for="|autre-${l.code()}|">Autre</label>
                </div>
            </div>

            <input class="form-control contre" hidden placeholder="Entrez votre proposition"
                   th:type="${l.code() == 'SALAIRE'} ? 'number' : 'text'"
                   th:min="${l.code() == 'SALAIRE'} ? '1' : null" th:name="|contre[${l.code()}]|"
                   th:value="${l.contre()}" th:disabled="${!vue.modifiable()}">
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4" th:if="${vue.modifiable()}">
            <button type="submit" name="action" value="VALIDER" id="btn-valider" class="btn btn-success"><i class="fa-solid fa-check me-1"></i> Valider</button>
            <button type="submit" name="action" value="ATTENDRE" id="btn-attendre" class="btn btn-warning"><i class="fa-regular fa-hourglass-half me-1"></i> Attendre</button>
            <button type="submit" name="action" value="REFUSER" id="btn-refuser" class="btn btn-danger"><i class="fa-solid fa-xmark me-1"></i> Refuser</button>
        </div>
    </form>

    <p class="mt-4 mb-0"><a th:href="@{/candidats/{id}/notifications(id=${vue.idCandidat()})}"><i class="fa-regular fa-bell me-1"></i> Mes notifications</a></p>
</main>

<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
    const form = document.getElementById('form');
    const lignes = [...document.querySelectorAll('.critere')];
    const btnValider = document.getElementById('btn-valider');
    const btnAttendre = document.getElementById('btn-attendre');
    const btnRefuser = document.getElementById('btn-refuser');

    function majEtat() {
        let complet = true, autre = false, non = false;

        lignes.forEach(l => {
            const choix = l.querySelector('input[type=radio]:checked');
            const contre = l.querySelector('.contre');
            const v = choix ? choix.value : null;

            contre.hidden = (v !== 'AUTRE');
            contre.required = (v === 'AUTRE');

            if (!v) { complet = false; return; }
            if (v === 'AUTRE') {
                autre = true;
                if (!contre.value.trim()) complet = false;
            }
            if (v === 'NON') non = true;
        });

        if (btnValider) {
            btnValider.disabled = !(complet && !autre && !non);
            btnAttendre.disabled = !(complet && autre);
            btnRefuser.disabled = !(complet && non && !autre);
        }
    }

    form.addEventListener('input', majEtat);
    form.addEventListener('change', majEtat);
    majEtat();
</script>
</body>
</html>
