<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Validation du besoin')}"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container-xl py-4">
<div class="page-header d-flex align-items-center gap-3 mb-4"><span class="icone"><i class="fa-solid fa-stamp"></i></span><div><h1 th:text="'Besoin n°' + ${besoin.id}"></h1><p class="text-muted mb-0">Postes acceptés par Finance et en attente de votre validation.</p></div></div><div th:replace="~{fragments :: messages}"></div><section class="card-grh overflow-hidden mb-3"><div class="table-responsive"><table class="table table-grh"><thead><tr><th>Poste</th><th>Salaire RH</th><th>Salaire validé Finance</th></tr></thead><tbody><tr th:each="poste : ${postes}"><td class="fw-semibold" th:text="${poste.poste.libelle}"></td><td th:text="${poste.salaireProposeRh}"></td><td th:text="${poste.salaireValideFinance}"></td></tr></tbody></table></div></section><div class="d-flex gap-2"><a class="btn btn-light border" th:href="@{/dg/besoins}">Retour</a><form th:action="@{/dg/besoins/{id}/valider(id=${besoin.id})}" method="post"><button class="btn btn-primary" type="submit">Valider les postes affichés</button></form></div></main><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
