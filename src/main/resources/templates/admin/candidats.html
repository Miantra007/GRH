<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Candidats')}"></head>
<body>
<header th:replace="~{header :: nav}"></header>
<main class="container-xl py-4">
    <div class="page-header d-flex align-items-center gap-3 mb-4">
        <span class="icone"><i class="fa-solid fa-user-graduate"></i></span>
        <div>
            <h1>Candidats</h1>
            <p class="text-muted small mb-0"><span id="compteur" th:text="${#lists.size(candidats)}">0</span> candidat(s)</p>
        </div>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card-grh overflow-hidden">
        <div class="p-3 border-bottom" th:unless="${#lists.isEmpty(candidats)}">
            <div class="input-group" style="max-width: 380px">
                <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="search" class="form-control" placeholder="Rechercher un candidat…" aria-label="Rechercher"
                       data-filtre-tableau="#tableau" data-compteur="#compteur">
            </div>
        </div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(candidats)}">
            <table class="table table-grh" id="tableau">
                <thead>
                <tr><th>Candidat</th><th>E-mail</th><th>Naissance</th><th class="col-actions"><span class="visually-hidden">Actions</span></th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${candidats}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="avatar" style="width:34px;height:34px;font-size:.8rem"
                                  th:text="${#strings.toUpperCase(#strings.substring(c.prenomCandidat ?: c.nomCandidat ?: '?', 0, 1))}">H</span>
                            <span class="fw-semibold" th:text="${c.prenomCandidat + ' ' + c.nomCandidat}">Nom</span>
                        </div>
                    </td>
                    <td th:text="${c.email}">email</td>
                    <td th:text="${#temporals.format(c.dtn, 'dd/MM/yyyy')} ?: '—'">date</td>
                    <td class="col-actions">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/candidats/{id}/integration(id=${c.id})}">
                            <i class="fa-solid fa-list-check me-1"></i> Intégration</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="etat-vide" th:if="${#lists.isEmpty(candidats)}">
            <i class="fa-solid fa-user-graduate"></i>
            <p class="fw-semibold text-body mb-0">Aucun candidat pour le moment</p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
