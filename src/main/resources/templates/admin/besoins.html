<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Besoins à traiter')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main class="container-xl py-4">
    <div class="page-header d-flex align-items-center gap-3 mb-4"><span class="icone"><i class="fa-solid fa-clipboard-list"></i></span><div><h1>Besoins à traiter</h1><p class="text-muted mb-0">Demandes créées ou retournées par la Finance.</p></div></div>
    <div th:replace="~{fragments :: messages}"></div>
    <div class="card-grh overflow-hidden">
        <div class="table-responsive" th:unless="${#lists.isEmpty(besoins)}"><table class="table table-grh"><thead><tr><th>N°</th><th>Direction</th><th>Département</th><th>Motif</th><th></th></tr></thead><tbody>
        <tr th:each="besoin : ${besoins}"><td class="col-id" th:text="${besoin.id}"></td><td th:text="${besoin.direction.nomDirection}"></td><td th:text="${besoin.departement.nomDept}"></td><td th:text="${besoin.motif}"></td><td class="col-actions"><a class="btn btn-primary btn-sm" th:href="@{/admin/besoins/{id}(id=${besoin.id})}">Traiter</a></td></tr>
        </tbody></table></div>
        <div class="etat-vide" th:if="${#lists.isEmpty(besoins)}"><i class="fa-solid fa-circle-check"></i><p class="fw-semibold text-body mb-1">Aucun besoin en attente</p><p class="small mb-0">Les demandes des directeurs apparaîtront ici.</p></div>
    </div>
</main><th:block th:replace="~{fragments :: scripts}"></th:block>
</body></html>
