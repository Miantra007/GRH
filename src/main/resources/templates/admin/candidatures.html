<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Candidatures reçues</title></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <div th:replace="~{fragments :: messages}"></div>
    <h1>Candidatures reçues</h1>
    <table>
        <thead><tr><th>Offre</th><th>Candidat</th><th>Email</th><th>Date de réception</th><th>Statut</th><th>Dossier</th></tr></thead>
        <tbody>
        <tr th:each="c : ${candidatures}">
            <td th:text="${c.offre.titre}"></td><td th:text="|${c.candidat.prenomCandidat} ${c.candidat.nomCandidat}|"></td>
            <td th:text="${c.candidat.email}"></td><td th:text="${c.dateCandidature}"></td><td th:text="${c.statut.libelle}"></td>
            <td><a th:href="@{/admin/candidatures/{id}(id=${c.id})}">Ouvrir le dossier</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(candidatures)}"><td colspan="6">Aucune candidature reçue.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
