<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Historique des employés')}"></head>
<body>
<header th:replace="~{header :: nav}"></header>
<main class="container-xl py-4">
    <div class="page-header d-flex flex-wrap align-items-center gap-3 mb-4">
        <span class="icone"><i class="fa-solid fa-clock-rotate-left"></i></span>
        <div class="flex-grow-1">
            <h1>Historique des employés</h1>
            <p class="text-muted small mb-0">Employés remplacés ou ayant changé de statut.</p>
        </div>
        <a class="btn btn-light border" th:href="@{/admin/employes}"><i class="fa-solid fa-users me-1"></i> Employés</a>
    </div>

    <div th:replace="~{fragments :: messages}"></div>

    <div class="card-grh overflow-hidden">
        <div class="table-responsive" th:unless="${#lists.isEmpty(historique)}">
            <table class="table table-grh">
                <thead>
                <tr><th>Depuis le</th><th>Employé</th><th>Statut</th><th>Motif</th><th>Enregistré le</th></tr>
                </thead>
                <tbody>
                <tr th:each="h : ${historique}">
                    <td class="text-nowrap" th:text="${#temporals.format(h.dateDebut, 'dd/MM/yyyy')}">date</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <span class="avatar" style="width:34px;height:34px;font-size:.8rem"
                                  th:text="${#strings.toUpperCase(#strings.substring(h.employe.nomEmploye, 0, 1))}">J</span>
                            <span class="fw-semibold" th:text="${h.employe.nomEmploye}">Nom</span>
                        </div>
                    </td>
                    <td><span th:replace="~{fragments :: statutEmploye(${h.statut?.libelle})}"></span></td>
                    <td th:text="${h.motif} ?: '—'">Motif</td>
                    <td class="text-nowrap text-muted small" th:text="${#temporals.format(h.dateEnregistrement, 'dd/MM/yyyy HH:mm')} ?: '—'">date</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="etat-vide" th:if="${#lists.isEmpty(historique)}">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <p class="fw-semibold text-body mb-1">Aucun historique pour le moment</p>
            <p class="small mb-0">Un employé apparaît ici quand il est remplacé à la validation d'un contrat.</p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
