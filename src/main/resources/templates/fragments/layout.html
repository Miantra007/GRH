<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<!-- ===================== <head> commun ===================== -->
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre} + ' · GRH'">GRH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<!-- ===================== Barre de navigation ===================== -->
<nav th:fragment="navbar" class="topbar navbar navbar-expand-lg py-2 sticky-top">
    <div class="container-xl">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/}">
            <span class="brand-logo"><i class="fa-solid fa-people-group"></i></span>
            GRH
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Afficher le menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-lg-4 gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:classappend="${uriCourante == '/'} ? 'active'">
                        <i class="fa-solid fa-gauge-high me-1"></i> Tableau de bord
                    </a>
                </li>
                <li class="nav-item dropdown" th:each="r : ${@navigation.rubriques}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                       th:classappend="${@navigation.estRubriqueActive(uriCourante, r)} ? 'active'">
                        <i class="fa-solid me-1" th:classappend="${r.groupe.icone}"></i>
                        <span th:text="${r.groupe.libelle}">Rubrique</span>
                    </a>
                    <ul class="dropdown-menu" th:classappend="${#lists.size(r.liens) > 8} ? 'menu-colonnes'">
                        <li th:each="l : ${r.liens}">
                            <a class="dropdown-item" th:href="@{${l.ecran.base}}"
                               th:classappend="${@navigation.estActif(uriCourante, l.ecran)} ? 'active'">
                                <i class="fa-solid" th:classappend="${l.ecran.icone}"></i>
                                <span th:text="${l.ecran.titre}">Écran</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===================== Messages flash ===================== -->
<div th:fragment="flash">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="fa-solid fa-circle-check"></i> <span th:text="${succes}">Succès</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
        <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${erreur}">Erreur</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</div>

<!-- ===================== Confirmation de suppression ===================== -->
<div th:fragment="modaleSuppression" class="modal fade" id="modaleSuppression" tabindex="-1" aria-labelledby="modaleSuppressionTitre" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content border-0 rounded-4" method="post">
            <div class="modal-body p-4 text-center">
                <div class="mb-3"><span class="section-icon bg-danger-subtle text-danger"><i class="fa-solid fa-trash-can"></i></span></div>
                <h2 class="h5 fw-bold" id="modaleSuppressionTitre">Supprimer cet élément ?</h2>
                <p class="text-muted mb-0"><strong data-libelle></strong> sera supprimé définitivement.</p>
            </div>
            <div class="modal-footer border-0 pt-0 justify-content-center gap-2">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Annuler</button>
                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash-can me-1"></i> Supprimer</button>
            </div>
        </form>
    </div>
</div>

<!-- ===================== Scripts communs ===================== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
