<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Candidature envoyée')}"></head>
<body>
<header th:replace="~{header :: nav}"></header>
<main class="container-xl py-4" style="max-width: 720px">
    <div class="card-grh card-corps text-center">
        <span class="icone mx-auto mb-3"><i class="fa-solid fa-circle-check"></i></span>
        <h1 class="h3 fw-bold">Candidature envoyée</h1>
        <p>Votre dossier pour l’offre « <strong th:text="${candidature.offre.titre}">offre</strong> » a bien été transmis.</p>

        <div class="alert alert-warning text-start">
            <p class="mb-0"><i class="fa-solid fa-circle-info me-1"></i>
                Pour répondre à une proposition d’embauche, choisir votre contrat puis le signer,
                <strong>connectez-vous</strong> avec l’adresse e-mail et le mot de passe saisis lors de votre candidature.</p>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a class="btn btn-outline-primary" th:href="@{/login}">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Se connecter</a>
            <a class="btn btn-link" href="/api/candidat/offres">Retour aux offres</a>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
