<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${offre.titre}">Offre</title></head>
<body>
<main>
    <p><a href="/api/candidat/offres">Retour aux offres</a></p>
    <h1 th:text="${offre.titre}">Titre de l’offre</h1>
    <p><strong>Profil recherché</strong></p><p th:text="${offre.profilRecherche}"></p>
    <p><strong>Description</strong></p><p th:text="${offre.description}"></p>
    <p th:if="${offre.dateLimite}">Date limite : <time th:text="${offre.dateLimite}"></time></p>
    <a th:href="@{/api/candidat/offres/{id}/postuler(id=${offre.id})}">Postuler</a>
</main>
</body>
</html>
