<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Décision financière')}"></head><body><header th:replace="~{fragments :: nav}"></header><main class="container-xl py-4">
<div class="page-header d-flex align-items-center gap-3 mb-4"><span class="icone"><i class="fa-solid fa-scale-balanced"></i></span><div><h1 th:text="'Besoin n°' + ${besoin.id}"></h1><p class="text-muted mb-0">Accepter ou refuser le salaire de chaque poste.</p></div></div><div th:replace="~{fragments :: messages}"></div><form th:action="@{/finance/besoins/{id}(id=${besoin.id})}" th:object="${formulaire}" method="post">
<section class="card-grh card-corps mb-3" th:each="poste, statut : ${postes}"><h2 class="titre-section mb-3" th:text="${poste.poste.libelle}"></h2><input type="hidden" th:field="*{lignes[__${statut.index}__].besoinPosteId}"><p class="encart info">Salaire suggéré par RH : <strong class="ms-1" th:text="${poste.salaireProposeRh}"></strong></p><div class="row g-3"><div class="col-md-4"><label class="form-label">Décision</label><select class="form-select" th:field="*{lignes[__${statut.index}__].decision}" required><option value="">Sélectionner</option><option value="ACCEPTEE">Accepter</option><option value="REFUSEE">Refuser</option></select></div><div class="col-md-8"><label class="form-label">Commentaire</label><textarea class="form-control" rows="2" th:field="*{lignes[__${statut.index}__].commentaire}"></textarea></div></div></section>
<section class="card-grh card-corps mb-3"><label class="form-label">Commentaire global</label><textarea class="form-control" rows="3" th:field="*{commentaireFinance}"></textarea></section><div class="d-flex gap-2"><a class="btn btn-light border" th:href="@{/finance/besoins}">Retour</a><button class="btn btn-primary" type="submit">Enregistrer la décision</button></div></form></main><th:block th:replace="~{fragments :: scripts}"></th:block></body></html>
