<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<!-- ===================== <head> commun ===================== -->
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' · GRH'">GRH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- La barre de navigation (header :: nav) est désormais dans header.html -->

<!-- ===================== Messages (succès / erreur) ===================== -->
<div th:fragment="messages">
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-start gap-2" role="alert" th:if="${succes}">
        <i class="fa-solid fa-circle-check mt-1"></i> <span th:text="${succes}">Succès</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-start gap-2" role="alert" th:if="${erreur}">
        <i class="fa-solid fa-triangle-exclamation mt-1"></i> <span th:text="${erreur}">Erreur</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
    </div>
</div>

<!-- ===================== Badge : statut d'un contrat (Créé / Signé / Validé) ===================== -->
<span th:fragment="statut(libelle)" th:if="${libelle != null}" class="badge-statut"
      th:classappend="${libelle == 'Créé'} ? 'cree' : (${libelle == 'Signé'} ? 'signe' : 'valide')">
    <i class="fa-solid" th:classappend="${libelle == 'Créé'} ? 'fa-pen-to-square' : (${libelle == 'Signé'} ? 'fa-file-signature' : 'fa-circle-check')"></i>
    <span th:text="${libelle}">Statut</span>
</span>

<!-- ===================== Badge : type de besoin (CREATION / REMPLACEMENT) ===================== -->
<span th:fragment="typeBesoin(type)" th:if="${type != null}" class="badge-statut"
      th:classappend="${type == 'CREATION'} ? 'valide' : 'cree'">
    <i class="fa-solid" th:classappend="${type == 'CREATION'} ? 'fa-circle-plus' : 'fa-arrow-right-arrow-left'"></i>
    <span th:text="${type == 'CREATION'} ? 'Création' : 'Remplacement'">Type</span>
</span>

<!-- ===================== Badge : statut d'un employé ===================== -->
<span th:fragment="statutEmploye(libelle)" th:if="${libelle != null}" class="badge-statut"
      th:classappend="${libelle == 'ACTIF'} ? 'valide' : (${libelle == 'EN_CONGE'} ? 'signe' : (${libelle == 'SUSPENDU'} ? 'cree' : 'neutre'))"
      th:text="${libelle == 'ACTIF'} ? 'Actif' : (${libelle == 'EN_CONGE'} ? 'En congé' : (${libelle == 'SUSPENDU'} ? 'Suspendu' : (${libelle == 'DEMISSIONNAIRE'} ? 'Démissionnaire' : (${libelle == 'LICENCIE'} ? 'Licencié' : 'Retraité'))))">Statut</span>

<!-- ===================== Ligne « libellé : valeur » d'une fiche ===================== -->
<div th:fragment="ligne(label, valeur)" class="detail-ligne">
    <dt th:text="${label}">Libellé</dt>
    <dd th:text="${valeur} ?: '—'">Valeur</dd>
</div>

<!-- ===================== Scripts communs + fenêtre de confirmation ===================== -->
<th:block th:fragment="scripts">
    <div class="modal fade" id="modaleConfirmation" tabindex="-1" aria-labelledby="modaleConfirmationTitre" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-body p-4 text-center">
                    <div class="mb-3"><span class="section-icon"><i class="fa-solid fa-circle-question"></i></span></div>
                    <h2 class="h5 fw-bold" id="modaleConfirmationTitre" data-titre>Confirmer</h2>
                    <p class="text-muted mb-0" data-message></p>
                </div>
                <div class="modal-footer border-0 pt-0 justify-content-center gap-2">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" data-confirmer><i class="fa-solid fa-check me-1"></i><span>Confirmer</span></button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
